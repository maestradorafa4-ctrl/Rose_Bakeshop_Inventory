<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Rose Bakeshop Inventory
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="header">

  <div class="brand">

    <div class="logo">
      🌹
    </div>

    <div>

      <div class="brand-name">
        Rose Bakeshop
      </div>

      <div class="brand-subtitle">
        Inventory Management System
      </div>

    </div>

  </div>

</header>



<main class="container">


  <div class="page-title">

    <h1>
      Inventory Dashboard
    </h1>

    <p>
      Manage and monitor your bakery products and stock.
    </p>

  </div>



  <div class="cards">


    <div class="card">

      <div class="card-title">
        Total Products
      </div>

      <div
        class="card-number"
        id="totalProducts">

        0

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Total Items
      </div>

      <div
        class="card-number"
        id="totalItems">

        0

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Low Stock
      </div>

      <div
        class="card-number"
        id="lowStock">

        0

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Out of Stock
      </div>

      <div
        class="card-number"
        id="outOfStock">

        0

      </div>

    </div>


  </div>



  <section class="inventory-panel">


    <div class="inventory-header">

      <div>

        <h2>
          Product Inventory
        </h2>

        <p class="small-text">
          Manage your bakery products.
        </p>

      </div>


      <div class="actions">

        <input
          type="text"
          id="searchInput"
          class="search"
          placeholder="Search products..."
        >


        <button
          class="add-btn"
          onclick="openAddModal()">

          + Add Product

        </button>

      </div>

    </div>



    <div
      id="tableContainer"
      class="table-wrapper">

      <div class="loading">
        Loading inventory...
      </div>

    </div>


  </section>


</main>



<div
  id="productModal"
  class="modal">


  <div class="modal-content">


    <div class="modal-header">

      <h2 id="modalTitle">
        Add Product
      </h2>


      <span
        class="close"
        onclick="closeModal()">

        &times;

      </span>

    </div>



    <input
      type="hidden"
      id="productId"
    >


    <div class="form-group">

      <label>
        Product Name
      </label>

      <input
        type="text"
        id="productName"
        placeholder="Example: Chocolate Cake"
      >

    </div>


    <div class="form-group">

      <label>
        Category
      </label>

      <select id="category">

        <option value="">
          Select Category
        </option>

        <option value="Cake">
          Cake
        </option>

        <option value="Bread">
          Bread
        </option>

        <option value="Pastry">
          Pastry
        </option>

        <option value="Cookies">
          Cookies
        </option>

        <option value="Donut">
          Donut
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>
        Quantity
      </label>

      <input
        type="number"
        id="quantity"
        min="0"
        placeholder="Enter quantity"
      >

    </div>


    <div class="form-group">

      <label>
        Price (₱)
      </label>

      <input
        type="number"
        id="price"
        min="0"
        step="0.01"
        placeholder="Enter price"
      >

    </div>


    <div class="modal-buttons">

      <button
        class="cancel-btn"
        onclick="closeModal()">

        Cancel

      </button>


      <button
        class="save-btn"
        onclick="saveProduct()">

        Save Product

      </button>

    </div>


  </div>

</div>



<div
  id="toast"
  class="toast">

  Saved successfully.

</div>



<script src="script.js"></script>


</body>

</html>
