<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rose Bakeshop - Inventory Manager Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, Helvetica, sans-serif;

      background: #fdf0eb;
      color: #171717;
    }

    .login-card {
      width: 430px;
      max-width: calc(100% - 32px);

      padding: 32px;

      background: #ffffff;
      border: 1px solid #ead9d2;
      border-radius: 24px;

      box-shadow: 0 10px 30px rgba(80, 40, 30, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .rose {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .logo p {
      color: #a07d75;
      font-size: 17px;
    }

    .form-group {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 700;
      color: #111111;
    }

    input {
      width: 100%;
      height: 44px;

      padding: 0 14px;

      border: 1px solid #ead5ce;
      border-radius: 10px;

      background: #ffffff;
      color: #171717;

      font-size: 16px;
      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #8d3033;
      box-shadow: 0 0 0 3px rgba(141, 48, 51, 0.12);
    }

    input.autofilled {
      background: #e5f0fc;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);

      border: none;
      background: transparent;

      cursor: pointer;
      color: #777;

      font-size: 17px;
    }

    .button {
      width: 100%;
      height: 41px;

      margin-top: 8px;

      border: none;
      border-radius: 9px;

      background: #812d30;
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.1s ease;
    }

    .button:hover {
      background: #702629;
    }

    .button:active {
      transform: scale(0.99);
    }

    .button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 16px;
      padding: 12px 14px;

      border-radius: 8px;

      font-size: 14px;
      line-height: 1.4;
    }

    .message.success {
      display: block;
      background: #e8f7ed;
      color: #216b38;
      border: 1px solid #b9e5c5;
    }

    .message.error {
      display: block;
      background: #fdeaea;
      color: #9b2828;
      border: 1px solid #efbaba;
    }

    /* Verification section */
    .verification {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee0db;
    }

    .verification.active {
      display: block;
    }

    .verification p {
      color: #745e59;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .code-input {
      text-align: center;
      letter-spacing: 8px;
      font-size: 22px;
      font-weight: 700;
    }

    .verify-button {
      margin-top: 12px;
    }

    @media (max-width: 500px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 25px 20px;
        border-radius: 20px;
      }

      .logo h1 {
        font-size: 23px;
      }

      .logo p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="logo">
      <div class="rose" aria-label="Rose">🌹</div>

      <h1>ROSE BAKESHOP</h1>

      <p>Inventory Manager Login</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          name="username"
          value="inventorymanager"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            value="inventory123"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Show password"
          >
            👁
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="gmail">Gmail</label>

        <input
          type="email"
          id="gmail"
          name="gmail"
          value="maestradorafa4@gmail.com"
          autocomplete="email"
          required
        />
      </div>

      <button
        type="submit"
        class="button"
        id="continueButton"
      >
        Continue to Verification
      </button>

    </form>

    <div id="message" class="message"></div>

    <section
      class="verification"
      id="verificationSection"
    >
      <p>
        Enter the 6-digit verification code to continue.
      </p>

      <input
        type="text"
        id="verificationCode"
        class="code-input"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
        placeholder="••••••"
      />

      <button
        type="button"
        class="button verify-button"
        id="verifyButton"
      >
        Verify & Continue
      </button>
    </section>

  </main>

  <script>
    "use strict";

    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const gmailInput = document.getElementById("gmail");

    const togglePassword =
      document.getElementById("togglePassword");

    const continueButton =
      document.getElementById("continueButton");

    const message =
      document.getElementById("message");

    const verificationSection =
      document.getElementById("verificationSection");

    const verificationCode =
      document.getElementById("verificationCode");

    const verifyButton =
      document.getElementById("verifyButton");


    /*
     * Show / hide password
     */
    togglePassword.addEventListener("click", () => {
      const isPassword =
        passwordInput.type === "password";

      passwordInput.type =
        isPassword ? "text" : "password";

      togglePassword.textContent =
        isPassword ? "🙈" : "👁";

      togglePassword.setAttribute(
        "aria-label",
        isPassword
          ? "Hide password"
          : "Show password"
      );
    });


    /*
     * Display a message
     */
    function showMessage(text, type) {
      message.textContent = text;

      message.className =
        "message " + type;
    }


    /*
     * Clear message
     */
    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }


    /*
     * Login / verification request
     *
     * This version does NOT call a missing API endpoint.
     * That prevents the "Request failed." error shown
     * in the screenshot.
     */
    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      clearMessage();

      const username =
        usernameInput.value.trim();

      const password =
        passwordInput.value;

      const gmail =
        gmailInput.value.trim();


      /*
       * Basic validation
       */
      if (!username) {
        showMessage(
          "Please enter your username.",
          "error"
        );

        usernameInput.focus();
        return;
      }

      if (!password) {
        showMessage(
          "Please enter your password.",
          "error"
        );

        passwordInput.focus();
        return;
      }

      if (!gmail) {
        showMessage(
          "Please enter your Gmail address.",
          "error"
        );

        gmailInput.focus();
        return;
      }

      if (!gmailInput.checkValidity()) {
        showMessage(
          "Please enter a valid Gmail address.",
          "error"
        );

        gmailInput.focus();
        return;
      }


      /*
       * Disable button while processing
       */
      continueButton.disabled = true;
      continueButton.textContent = "Processing...";


      /*
       * Simulate verification request.
       *
       * Replace this section with your real backend
       * request when your API is available.
       */
      setTimeout(() => {

        continueButton.disabled = false;
        continueButton.textContent =
          "Continue to Verification";

        verificationSection.classList.add("active");

        showMessage(
          "Verification code sent. Enter the code to continue.",
          "success"
        );

        verificationCode.focus();

      }, 700);
    });


    /*
     * Only allow numbers in verification code
     */
    verificationCode.addEventListener(
      "input",
      () => {

        verificationCode.value =
          verificationCode.value
            .replace(/\D/g, "")
            .slice(0, 6);

      }
    );


    /*
     * Verify code
     *
     * Demo code: 123456
     *
     * Replace this with your backend verification
     * when the real API is connected.
     */
    verifyButton.addEventListener(
      "click",
      () => {

        clearMessage();

        const code =
          verificationCode.value.trim();

        if (code.length !== 6) {
          showMessage(
            "Please enter the 6-digit verification code.",
            "error"
          );

          verificationCode.focus();
          return;
        }

        if (code !== "123456") {
          showMessage(
            "Invalid verification code.",
            "error"
          );

          verificationCode.focus();
          return;
        }

        showMessage(
          "Verification successful. Welcome to Rose Bakeshop!",
          "success"
        );

        /*
         * Redirect to the inventory dashboard here.
         *
         * Example:
         *
         * window.location.href = "dashboard.html";
         */
      }
    );
  </script>

</body>
</html>
